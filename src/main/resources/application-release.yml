quarkus:
  profile: release
  log:
    level: INFO
    category:
      "com.tuapp":
        level: WARN
  hibernate-orm:
    log:
      sql: false
    database:
      generation: validate
  datasource:
    jdbc:
      url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rest-client:
    pokemon-api:
      url: https://pokeapi.co/api/v2/
      connect-timeout: 5000
      read-timeout: 10000
app:
  profile: 'release'
  alias: ${APP_SOBRENOMBRE:mypoc_release}
  database:
    host: ${DB_HOST:mysql}
    port: ${DB_PORT:3306}
    name: ${DB_NAME:mi_base_datos}
    user: ${DB_USER:usuario_default}
    password: ${DB_PASSWORD:password_default}

  server:
    url: ${SERVER_URL:http://localhost:8080}
    timeout: ${SERVER_TIMEOUT:30}

  features:
    enabled: ${FEATURES_ENABLED:true}
    max-retries: ${MAX_RETRIES:3}