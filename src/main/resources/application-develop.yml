quarkus:
  profile: develop
  log:
    level: DEBUG
    category:
      "org.hibernate.SQL":
        level: DEBUG
      "org.hibernate.type.descriptor.sql.BasicBinder":
        level: TRACE
      "org.hibernate.orm.jdbc.bind":
        level: TRACE
  hibernate-orm:
    log:
      sql: true
      bind-parameters: true
    database:
      generation: drop-and-create
  datasource:
    jdbc:
      url: jdbc:mysql://localhost:3306/certificados
    username: root
    password: root_dev_demo_dian
  rest-client:
    pokemon-api:
      url: https://pokeapi.co/api/v2/
      connect-timeout: 5000
      read-timeout: 10000
app:
  profile: 'develop'
  alias: ${APP_SOBRENOMBRE:mypoc_dev}
  database:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    name: ${DB_NAME:mi_base_datos}
    user: ${DB_USER:usuario_default}
    password: ${DB_PASSWORD:password_default}

  server:
    url: ${SERVER_URL:http://localhost:8080}
    timeout: ${SERVER_TIMEOUT:30}

  features:
    enabled: ${FEATURES_ENABLED:true}
    max-retries: ${MAX_RETRIES:3}